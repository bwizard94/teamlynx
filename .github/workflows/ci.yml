name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets. Cheap CPU jobs only — no GPU/CUDA, no YOLO/torch, no device flash.

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision-headless]"

      - name: Run pytest
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: pytest

  firmware-native:
    name: firmware native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: firmware/platformio.ini

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/lib/**', 'firmware/test/**') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Host unit tests (no flash)
        run: pio test -e native
