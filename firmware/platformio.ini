; TeamLynx head-tracker firmware (Phase 3 bench rig)
; BNO085 (I2C) -> ESP32 -> framed binary over USB serial. See docs/hardware/.
;
;   pio run                      # build both boards
;   pio run -e esp32dev -t upload
;   pio device monitor -e esp32dev   (binary protocol; use `python -m lynx.hw monitor` instead)
;   pio test -e native           # host-side unit tests for COBS/CRC/rail-switch logic

[platformio]
default_envs = esp32dev, esp32s3

[common]
lib_deps =
    adafruit/Adafruit BNO08x@^1.2.5
build_flags =
    -Wall
    -Wextra
    -DLYNX_FW_MAJOR=1
    -DLYNX_FW_MINOR=0
    -DLYNX_FW_PATCH=0

; ESP32-DevKitC (WROOM-32/32E). "USB serial" is the on-board CP2102/CH340 USB-UART bridge.
[env:esp32dev]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
monitor_speed = 460800
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DLYNX_BOARD_ESP32DEV=1

; ESP32-S3-DevKitC-1. Native USB (the port labelled "USB"), HW CDC/JTAG peripheral.
[env:esp32s3]
platform = espressif32@^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 460800
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DLYNX_BOARD_ESP32S3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Host-side unit tests of the hardware-independent code in lib/LynxCore.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_ignore = Adafruit BNO08x
build_src_filter = -<*>
