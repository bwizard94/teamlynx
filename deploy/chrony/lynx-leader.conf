# TeamLynx squad-leader Jetson: the squad's time reference when offline.
# The travel router has no RTC and no internet in the field, so it cannot serve good time; the leader
# serves its own (RTC-backed) clock at stratum 8 and every other headset follows it. Log timestamps across
# the squad then agree to a few ms, which is all the after-action review needs.
local stratum 8 orphan
allow 192.168.8.0/24
makestep 1.0 3
